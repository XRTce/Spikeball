server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    include /etc/nginx/rally-security.conf;

    # Rally is a single-page app: unknown paths are routes, not 404s. The final
    # argument is a URI, so nginx redirects internally and the `= /index.html`
    # block below still applies its no-cache header.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset names never change contents.
    location /assets/ {
        include /etc/nginx/rally-security.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location /icons/ {
        include /etc/nginx/rally-security.conf;
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # The shell, the service worker and the manifest decide when an update is
    # picked up, so they must never come from a stale cache.
    location = /index.html {
        include /etc/nginx/rally-security.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /sw.js {
        include /etc/nginx/rally-security.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /registerSW.js {
        include /etc/nginx/rally-security.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/rally-security.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location = /robots.txt { access_log off; }
    location = /favicon.svg { access_log off; }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;
}
