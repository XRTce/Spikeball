# nginx only inherits add_header directives when the current level defines none
# of its own. Every location below that sets a Cache-Control header therefore
# has to include this file explicitly, or it would silently serve the app shell
# without a Content-Security-Policy.

# Rally talks to nobody: no API, no analytics, no web fonts, no CDN.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
