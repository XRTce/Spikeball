name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check the committed icons match the generator
        run: |
          npm run icons
          if ! git diff --quiet -- public; then
            echo "::error::public/ is out of date - run 'npm run icons' and commit the result"
            git --no-pager diff --stat -- public
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rally-dist
          path: dist
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rally-roundnet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name rally -p 8080:8080 rally-roundnet:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q "Rally"
          curl -fsS http://127.0.0.1:8080/manifest.webmanifest >/dev/null
          # SPA fallback must serve the shell for unknown routes.
          curl -fsS http://127.0.0.1:8080/t/does-not-exist | grep -q "<div id=\"root\">"
          docker rm -f rally
