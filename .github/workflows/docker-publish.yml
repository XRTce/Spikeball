name: Build and publish Docker image

on:
  push:
    branches: ['**']
  workflow_dispatch:

# A newer push to a branch supersedes an in-flight build of the same branch;
# only the latest commit's image is worth finishing.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image and tag
        # GHCR paths must be lowercase; github.repository preserves the repo's
        # actual casing (XRTce/Spikeball). Tags can't contain '/', so a branch
        # like feature/public-tournaments becomes feature-public-tournaments.
        # main is the one exception: it publishes as :latest, not :main.
        id: tags
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            tag=latest
          else
            tag=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/' '-' | sed 's/[^a-z0-9._-]/-/g')
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
