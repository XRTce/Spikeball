services:
  rally:
    build:
      context: .
      dockerfile: Dockerfile
    image: rally-roundnet:latest
    container_name: rally
    restart: unless-stopped
    # Change the host port if 8080 is taken; the container always listens on 8080.
    ports:
      - "${RALLY_PORT:-8080}:8080"
    volumes:
      - rally-data:/data
    # Optional sync settings, read from .env (see .env.example).
    environment:
      RALLY_CORS_ORIGIN: ${RALLY_CORS_ORIGIN:-}
      RALLY_RETENTION_DAYS: ${RALLY_RETENTION_DAYS:-365}
      RALLY_TRUST_PROXY: ${RALLY_TRUST_PROXY:-}
    read_only: true
    tmpfs:
      # Node needs somewhere to write if it ever does (e.g. os.tmpdir()).
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rally-data:
