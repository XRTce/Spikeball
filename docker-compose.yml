services:
  rally:
    build:
      context: .
      dockerfile: Dockerfile
    image: rally-roundnet:latest
    container_name: rally
    restart: unless-stopped
    # Change the host port if 8080 is taken; the container always listens on 8080.
    ports:
      - "${RALLY_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      # nginx needs somewhere to write its temporary bodies and pid file.
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx starts as root, then drops its workers to the nginx user; port 8080
    # needs no privileged bind, so NET_BIND_SERVICE is not required.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
